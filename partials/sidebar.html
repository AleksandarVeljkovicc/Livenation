<aside aria-label="Social media, newsletter and sponsors">
    <button class="aside_close_button" type="button" aria-label="Close sidebar">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
    <h3 class="aside_header">
        <span class="aside_header_text">Social Media </span>
        <span><img class="ribbon" src="./images/end_ribbon.png"></span>
    </h3>
    <div id="social_media_icons">
        <a class="social_icon" href="#"><i class="fa-brands fa-facebook-f"></i></a>
        <a class="social_icon" href="#"><i class="fa-brands fa-twitter"></i></a>
        <a class="social_icon" href="#"><i class="fa-solid fa-rss"></i></a>
    </div>
    <h3 class="aside_header">
        <span class="aside_header_text">Join our newesletter</span>
        <span><img class="ribbon" src="./images/end_ribbon.png"></span>
    </h3>
    <div>
        <p style="margin: 0;"> Join our newesletter for latest updates.</p>
        <form action="#" method="post" id="newsletter_form">
            <input type="email">
            <button type="submit">Join</button>
        </form>
    </div>

    <h3 class="aside_header">
        <span class="aside_header_text">Sponsors</span>
        <span><img class="ribbon" src="./images/end_ribbon.png"></span>
    </h3>
    <div id="sponsors">
        <img class="sponsor" src="./images/sponsors_alibaba.png">
        <img class="sponsor" src="./images/sponsors_raiffeisen.png">
        <img class="sponsor" src="./images/sponsors_spotify.png">
        <img class="sponsor" src="./images/sponsors_tmobile.png">
        <img class="sponsor" src="./images/sponsors_zildjian.png">

</aside>
